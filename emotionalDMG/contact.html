<!DOCTYPE html>
<html>
<head>
  <title>Emotional.dmg — contact</title>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #ffffff;
      color: #000000;
      font-family: Arial;
      display: flex;
      justify-content: center;
      padding-top: 80px;
    }

    .wrapper {
      position: relative;
      width: 400px;
    }

    .upright {
      position: absolute;
      top: -101px;
      right: -62px;
      width: 234px;
      height: 193px;
      image-rendering: pixelated;
      z-index: 1;
    }

    .box {
      border: 4px solid #00ff00;
      padding: 20px;
      padding-top: 60px;
      min-height: 220px;
      position: relative;
    }

    h2 { color: #00ff00; margin-bottom: 16px; }

    .contacts { display: none; }

    .contacts a {
      display: block;
      color: #00ff00;
      font-size: 14px;
      margin-bottom: 10px;
      text-decoration: none;
    }

    .contacts a:hover { text-decoration: underline; }

    .gate {
      font-size: 13px;
      margin-bottom: 12px;
    }

    .cf-turnstile { margin-bottom: 12px; }

    #verify-btn {
      background: none;
      border: none;
      color: #000000;
      font-size: 13px;
      cursor: pointer;
      padding: 0;
      font-family: Arial;
      display: none;
    }

    #verify-btn:hover { text-decoration: underline; }

    #status {
      font-size: 12px;
      margin-top: 8px;
      color: #00ff00;
    }

    @media (prefers-color-scheme: dark) {
      body { background: #000000; color: #ffffff; }
      #verify-btn { color: #ffffff; }
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <img class="upright" src="https://raw.githubusercontent.com/n0ty-z/n0ty-z.github.io/main/emotionalDMG/assets/seirra%20upright.png" alt="">

    <div class="box">
      <h2>contact</h2>

      <div class="gate">
        <p>prove you're not a bot first.</p>
        <br>
        <div class="cf-turnstile"
          data-sitekey="0x4AAAAAADbooFUUr7StaVn-"
          data-callback="onTurnstileSuccess"
          data-theme="auto">
        </div>
        <button id="verify-btn" onclick="verify()">verify</button>
        <div id="status"></div>
      </div>

      <div class="contacts" id="contacts">
        <a href="#">twitter — @placeholder</a>
        <a href="#">email — placeholder@email.com</a>
        <a href="#">github — placeholder</a>
        <a href="#">discord — placeholder</a>
      </div>
    </div>
  </div>

  <script>
    let token = null;

    function onTurnstileSuccess(t) {
      token = t;
      document.getElementById('verify-btn').style.display = 'inline';
    }

    async function verify() {
      if (!token) return;
      document.getElementById('status').textContent = 'checking...';

      const res = await fetch('https://emotional-dmg.hmm-n0tyz.workers.dev', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token })
      });

      const data = await res.json();

      if (data.success) {
        document.querySelector('.gate').style.display = 'none';
        document.getElementById('contacts').style.display = 'block';
      } else {
        document.getElementById('status').textContent = 'failed. try again.';
      }
    }
  </script>

</body>
</html>
